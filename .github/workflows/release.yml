name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (ARM64), native build
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'

          # macOS — Intel (x86_64), cross-compiled on the ARM64 runner.
          # `macos-13` queues for hours (community reports 30-60 min routinely,
          # we observed 3h+). Apple Silicon runners handle x86_64 targets via
          # the cross toolchain + tauri-bundler, and the resulting DMG runs
          # under Rosetta on Intel Macs exactly the same as a native build.
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'

          # Linux — x86_64 (produces .deb + .AppImage)
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

          # Windows — x86_64 (produces .msi + NSIS .exe)
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache Rust compilation artifacts — saves ~10 min on subsequent runs
      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Ubuntu 22.04 — Tauri v2 system dependencies
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # Icons are pre-generated and committed — no generation step needed in CI

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key — generate with: cargo tauri signer generate -w ~/.tauri/cloudorbit.key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── Apple code-signing (uncomment when Apple Developer account is ready) ──
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CloudOrbit ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/slothlabs/cloudorbit/blob/main/CHANGELOG.md) for details.

            **Install via Homebrew:**
            ```bash
            brew install --cask slothlabs/tap/cloudorbit
            ```

            **Install via WinGet:**
            ```powershell
            winget install SlothLabs.CloudOrbit
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # tauri-action uploads bundles but not .sig files.
      # Re-sign the tar.gz we know tauri built, then upload the .sig.
      - name: Sign and upload updater signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          sign() {
            local tgz="$1" upload_name="$2"
            [ -f "$tgz" ] || return 0
            echo "Signing $tgz -> $upload_name"
            npx @tauri-apps/cli signer sign "$tgz" \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" 2>/dev/null || true
            if [ -f "${tgz}.sig" ]; then
              cp "${tgz}.sig" "/tmp/${upload_name}"
              gh release upload "${{ github.ref_name }}" "/tmp/${upload_name}" \
                --repo "${{ github.repository }}" --clobber
              echo "  uploaded ${upload_name}"
            fi
          }
          sign "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CloudOrbit.app.tar.gz" \
               "CloudOrbit_aarch64.app.tar.gz.sig"
          sign "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/CloudOrbit.app.tar.gz" \
               "CloudOrbit_x64.app.tar.gz.sig"
          for f in src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz; do
            [ -f "$f" ] || continue
            sign "$f" "$(basename "$f").sig"
          done
          for f in src-tauri/target/release/bundle/nsis/*-setup.nsis.zip; do
            [ -f "$f" ] || continue
            sign "$f" "$(basename "$f").sig"
          done
