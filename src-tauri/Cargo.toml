[package]
name    = "cloudorbit"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                  = { version = "2", features = [] }
tauri-plugin-shell     = "2"
tauri-plugin-updater   = "2"
tauri-plugin-process   = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }

# AWS SDK
aws-sdk-sso          = "1"
aws-sdk-ssooidc      = "1"
aws-sdk-eks          = "1"
aws-sdk-ec2          = "1"
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

# HTTP — used to exchange temp creds for a federation sign-in token
# native-tls so the system Keychain certs are trusted (corporate CAs, Cloudflare Zero Trust, etc.)
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }

# System vault — stores SSO tokens in macOS Keychain / Windows Credential Vault / Linux Libsecret
keyring = "3"

# Utilities
dirs       = "5"
sha1       = { version = "0.10", features = ["std"] }
hex        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
open       = "5"
anyhow     = "1"
