name: Update Homebrew Tap

# Runs automatically when a GitHub Release is published (not just created as draft)
on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cloudorbit repo
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: |
          # Strip leading 'v': v0.1.0 → 0.1.0
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Download the actual DMG files to compute their SHA256 hashes
      # (Homebrew requires exact hashes in the cask)
      - name: Compute DMG SHA256 hashes
        id: sha
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          curl -fsSL "${BASE}/CloudOrbit_${VERSION}_aarch64.dmg" -o arm.dmg
          curl -fsSL "${BASE}/CloudOrbit_${VERSION}_x64.dmg"     -o x64.dmg

          echo "arm=$(sha256sum arm.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "x64=$(sha256sum x64.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap repo
        uses: actions/checkout@v4
        with:
          repository: slothlabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # Render the cask template with real version + SHA256 values
      - name: Write updated cask file
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA_ARM: ${{ steps.sha.outputs.arm }}
          SHA_X64: ${{ steps.sha.outputs.x64 }}
        run: |
          mkdir -p homebrew-tap/Casks
          python3 - << 'PY'
          import os, pathlib

          tmpl = pathlib.Path("distribute/homebrew/cloudorbit.rb.tmpl").read_text()
          result = (tmpl
              .replace("__VERSION__", os.environ["VERSION"])
              .replace("__SHA_ARM__", os.environ["SHA_ARM"])
              .replace("__SHA_X64__", os.environ["SHA_X64"]))
          pathlib.Path("homebrew-tap/Casks/cloudorbit.rb").write_text(result)
          print("Cask written OK")
          PY

      - name: Commit and push to tap repo
        run: |
          cd homebrew-tap
          git config user.name  "cloudorbit-bot"
          git config user.email "bot@slothlabs.org"
          git add Casks/cloudorbit.rb
          git diff --staged --quiet || git commit -m "chore: bump cloudorbit to ${{ steps.ver.outputs.version }}"
          git push
