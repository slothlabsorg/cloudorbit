name: Feature request
description: Suggest an idea for CloudOrbit
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem you're trying to solve. What's frustrating about the current experience?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Be as specific as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - AWS SSO / Authentication
        - Session management
        - EKS / Kubernetes
        - EC2 / SSM
        - Web Console
        - UI / UX
        - Other
    validations:
      required: true
