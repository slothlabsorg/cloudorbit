[package]
name    = "cloudorbit"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                  = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell     = "2"
tauri-plugin-updater   = "2"
tauri-plugin-process   = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }

# AWS SDK
aws-sdk-sso          = "1"
aws-sdk-ssooidc      = "1"
aws-sdk-eks          = "1"
aws-sdk-ec2          = "1"
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# Corporate SSL-inspection proxies (Zscaler / Netskope / Cloudflare Zero Trust
# etc.) intercept TLS with a root CA installed in the system keychain. The
# default rustls HTTP client used by aws-config only trusts webpki-roots, so
# those interceptors fail with "UnknownCA". We build a hyper/native-tls client
# instead — native-tls reads the system trust store.
aws-smithy-runtime   = { version = "1", features = ["connector-hyper-0-14-x"] }
hyper-tls            = "0.5"
hyper                = { version = "0.14", features = ["client", "http1", "http2"] }

# HTTP — used to exchange temp creds for a federation sign-in token
# native-tls so the system Keychain certs are trusted (corporate CAs, Cloudflare Zero Trust, etc.)
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }

# System vault — stores SSO tokens in macOS Keychain / Windows Credential Vault / Linux Libsecret
keyring = "3"

# Utilities
dirs       = "5"
sha1       = { version = "0.10", features = ["std"] }
hex        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
open       = "5"
anyhow     = "1"
