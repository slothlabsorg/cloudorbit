name: CI

on:
  push:
    branches: [main]
    # Don't re-run on tag pushes — the release workflow handles those
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR/branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        # One platform is enough for unit/logic tests — saves 3× the minutes
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # ── Frontend ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest (unit tests)
        run: npm test
        # Note: Playwright (interaction + screenshot tests) runs locally only.
        # It requires a live dev server + Chromium download and is too slow/flaky
        # for CI. Run locally with: npm run test:interactions

      # ── Rust ────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: cargo test (unit)
        working-directory: src-tauri
        run: cargo test --locked

      # ── LocalStack integration tests ─────────────────────────────────────
      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.2.3
        with:
          image-tag: 'latest'
          install-awslocal: true

      - name: Bootstrap LocalStack resources
        run: bash tests/localstack/setup.sh
        env:
          AWS_ENDPOINT_URL: http://localhost:4566

      - name: cargo test (LocalStack integration)
        working-directory: src-tauri
        run: cargo test --locked -- --ignored
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
